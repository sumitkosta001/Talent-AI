# ==============================================================================
# ALEMBIC CONFIGURATION — TalentAI API Gateway
# ==============================================================================
#
# This is the root Alembic configuration file for the TalentAI API Gateway.
#
# IMPORTANT: sqlalchemy.url is intentionally left EMPTY here.
# The actual DATABASE_URL is loaded at runtime inside env.py from
# the Pydantic settings system (app.config.settings), ensuring a
# single source of truth with zero duplication.
#
# Location: apps/api-gateway/alembic.ini
# Docs: https://alembic.sqlalchemy.org/en/latest/tutorial.html
# ==============================================================================

[alembic]

# Path to the Alembic migration environment directory (relative to this file).
script_location = alembic

# Template used when generating new revision files via `alembic revision`.
# Points to the Mako template inside the alembic/ directory.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for revision file timestamps.
# Use UTC for consistency across development and production environments.
timezone = UTC

# sys.path prepend: ensures `app.*` imports resolve correctly when
# running `alembic` from the apps/api-gateway/ directory.
prepend_sys_path = .

# Maximum length for auto-generated revision IDs.
# Shorter IDs are easier to reference in commands (e.g., `alembic upgrade abc123`).
truncate_slug_length = 40

# Set to 'true' to run the environment during `alembic list_templates`.
# Not needed in production workflows.
# revision_environment = false

# Database connection URL — intentionally EMPTY.
# env.py overrides this at runtime from app.config.settings.settings.database.url
# so there is exactly ONE source of truth for the connection string.
sqlalchemy.url =


# ==============================================================================
# LOGGING CONFIGURATION
# ==============================================================================
# Controls Alembic and SQLAlchemy log output during migrations.
# Set sqlalchemy level to INFO to see generated SQL. Set to WARN for quiet runs.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
