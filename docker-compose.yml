version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: talentai-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_secure}
      POSTGRES_DB: ${POSTGRES_DB:-talentai}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - talentai-network

  redis:
    image: redis:7-alpine
    container_name: talentai-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password_secure}
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - talentai-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: talentai-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-rabbitmq_password_secure}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    networks:
      - talentai-network

  minio:
    image: minio/minio:RELEASE.2023-09-07T02-42-57Z
    container_name: talentai-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_password_secure}
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    networks:
      - talentai-network

networks:
  talentai-network:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
  miniodata:
